name: Nightly

# The full CI suite on main every night, plus the e2e job (the real Claude Code binary against
# a local mock API: no key, no cost).
on:
  schedule:
    - cron: '17 18 * * *'   # 18:17 UTC = 03:17 KST, off-peak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true
    secrets: inherit
