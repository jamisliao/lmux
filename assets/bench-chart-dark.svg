<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" role="img" aria-labelledby="t d">
  <title id="t">cmux vs lmux: app size, memory, idle CPU</title>
  <desc id="d">cmux 0.65.2: app 454 MB, memory 834 MB (all processes), idle CPU 2.9%. lmux: to be measured (TBD). Lower is better.</desc>
  <!--
    Template. Each metric is scaled on its own: the cmux bar is 100% (420px).
    To fill in lmux: replace the dotted placeholder line with
      <path> bar of width = 420 * lmux / cmux, fill "#88C0D0", and swap "TBD" for the value.
    Keep both variants (bench-chart.svg / bench-chart-dark.svg) in sync.
  -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="20" font-size="15" font-weight="600" fill="#ECEFF4">Same Mac, same workload</text>
    <text x="0" y="40" font-size="12" fill="#99A2B3">Lower is better. Each metric is scaled to cmux = 100%.</text>
    <g font-size="12" fill="#C4CBD7">
      <rect x="564" y="11" width="12" height="12" rx="3" fill="#D08770"/><text x="582" y="21">cmux 0.65.2</text>
      <line x1="672" x2="684" y1="17" y2="17" stroke="#88C0D0" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round"/><text x="690" y="21">lmux (TBD)</text>
    </g>
    <text x="0" y="88" font-size="13" font-weight="600" fill="#ECEFF4">App size</text>
    <text x="0" y="106" font-size="11" fill="#99A2B3">on disk</text>
    <text x="202" y="84" font-size="11" text-anchor="end" fill="#C4CBD7">cmux</text>
    <path d="M214 73 H630 A4 4 0 0 1 634 77 V83 A4 4 0 0 1 630 87 H214 Z" fill="#D08770"/>
    <text x="644" y="85" font-size="12" font-weight="600" fill="#ECEFF4" style="font-variant-numeric: tabular-nums">454 MB</text>
    <text x="202" y="108" font-size="11" text-anchor="end" fill="#C4CBD7">lmux</text>
    <line x1="214" x2="634" y1="104" y2="104" stroke="#88C0D0" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round" stroke-opacity="0.7"/>
    <text x="644" y="109" font-size="12" font-weight="600" fill="#99A2B3">TBD</text>
    <line x1="0" x2="760" y1="132" y2="132" stroke="#3B4252" stroke-width="1"/>
    <text x="0" y="162" font-size="13" font-weight="600" fill="#ECEFF4">Memory</text>
    <text x="0" y="180" font-size="11" fill="#99A2B3">all processes, idle</text>
    <text x="202" y="158" font-size="11" text-anchor="end" fill="#C4CBD7">cmux</text>
    <path d="M214 147 H630 A4 4 0 0 1 634 151 V157 A4 4 0 0 1 630 161 H214 Z" fill="#D08770"/>
    <text x="644" y="159" font-size="12" font-weight="600" fill="#ECEFF4" style="font-variant-numeric: tabular-nums">834 MB</text>
    <text x="202" y="182" font-size="11" text-anchor="end" fill="#C4CBD7">lmux</text>
    <line x1="214" x2="634" y1="178" y2="178" stroke="#88C0D0" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round" stroke-opacity="0.7"/>
    <text x="644" y="183" font-size="12" font-weight="600" fill="#99A2B3">TBD</text>
    <line x1="0" x2="760" y1="206" y2="206" stroke="#3B4252" stroke-width="1"/>
    <text x="0" y="236" font-size="13" font-weight="600" fill="#ECEFF4">Idle CPU</text>
    <text x="0" y="254" font-size="11" fill="#99A2B3">60 s average</text>
    <text x="202" y="232" font-size="11" text-anchor="end" fill="#C4CBD7">cmux</text>
    <path d="M214 221 H630 A4 4 0 0 1 634 225 V231 A4 4 0 0 1 630 235 H214 Z" fill="#D08770"/>
    <text x="644" y="233" font-size="12" font-weight="600" fill="#ECEFF4" style="font-variant-numeric: tabular-nums">2.9 %</text>
    <text x="202" y="256" font-size="11" text-anchor="end" fill="#C4CBD7">lmux</text>
    <line x1="214" x2="634" y1="252" y2="252" stroke="#88C0D0" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round" stroke-opacity="0.7"/>
    <text x="644" y="257" font-size="12" font-weight="600" fill="#99A2B3">TBD</text>
    <text x="0" y="310" font-size="11" fill="#99A2B3">cmux: one daily-use snapshot on an M-series Mac, 2026-10-31. lmux: measured by scripts/bench.sh before release.</text>
  </g>
</svg>
